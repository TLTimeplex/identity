apiVersion: batch/v1
kind: Job
metadata:
  name: hydra-migrate
  namespace: identity
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: hydra-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-database
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h hydra-db -p 5432 -U hydra -d hydra; do
                echo "Waiting for Hydra PostgreSQL..."
                sleep 3
              done
      containers:
        - name: migrate
          image: oryd/hydra:v26.2.0
          args:
            - migrate
            - sql
            - up
            - -e
            - -y
          env:
            - name: HYDRA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: HYDRA_DB_PASSWORD
            - name: DSN
              value: "postgres://hydra:$(HYDRA_DB_PASSWORD)@hydra-db:5432/hydra?sslmode=disable"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: laravel-migrate
  namespace: identity
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: laravel-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-database
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h laravel-db -p 5432 -U identity -d identity; do
                echo "Waiting for Laravel PostgreSQL..."
                sleep 3
              done
      containers:
        - name: migrate
          image: ghcr.io/tltimeplex/identity
          command:
            - sh
            - -c
            - php artisan migrate --force && php artisan db:seed --force
          env:
            - name: APP_NAME
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: APP_NAME
            - name: APP_ENV
              value: production
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: APP_KEY
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: APP_URL
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: laravel-db
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: identity
            - name: DB_USERNAME
              value: identity
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: DB_PASSWORD
            - name: SESSION_DRIVER
              value: database
            - name: SESSION_SECURE_COOKIE
              value: "true"
            - name: CACHE_STORE
              value: database
            - name: QUEUE_CONNECTION
              value: database
            - name: HYDRA_ADMIN_URL
              value: "http://hydra:4445"
            - name: HYDRA_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: HYDRA_PUBLIC_URL
            - name: HYDRA_TIMEOUT
              value: "5"
            - name: HYDRA_CONNECT_TIMEOUT
              value: "2"
            - name: MAIL_MAILER
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_MAILER
            - name: MAIL_SCHEME
              value: "null"
            - name: MAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_HOST
            - name: MAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_PORT
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_PASSWORD
            - name: MAIL_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_FROM_ADDRESS
            - name: MAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: MAIL_FROM_NAME
