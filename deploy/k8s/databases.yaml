apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laravel-postgres-data
  namespace: identity
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-db
  namespace: identity
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: laravel-db
  template:
    metadata:
      labels:
        app: laravel-db
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: identity
            - name: POSTGRES_USER
              value: identity
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: identity-app-secrets
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: laravel-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-db
  namespace: identity
spec:
  selector:
    app: laravel-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
